name: Telegram

# Plantão do bot: a cada 5 minutos fica ~4,5 min ouvindo o Telegram (espera longa), grava os pedidos no cofre e
# manda as respostas prontas. Nada do conteúdo aparece neste registro.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      plantao:
        description: 'segundos de plantão'
        default: '270'

permissions:
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      COFRE_REPO: ${{ secrets.COFRE_REPO }}
      COFRE_TOKEN: ${{ secrets.COFRE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Plantão
        run: python3 nuvem/telegram.py "${{ github.event.inputs.plantao || '270' }}"

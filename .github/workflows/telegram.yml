name: Telegram

# Plantão do bot: fica ouvindo o Telegram (espera longa), grava os pedidos no cofre e manda as respostas prontas.
# Nada do conteúdo aparece neste registro.
# 11/11: o agendamento do GitHub deixava buracos de 6 a 8 h (o bot só respondia horas depois). Agora cada plantão, ao
# terminar, CHAMA O PRÓXIMO (corrente contínua); o agendamento fica só para religar a corrente se ela cair.
# O mesmo plantão é o despertador das salas do cofre (nuvem/telegram.py, despertar). Para parar: crie nuvem/PARAR_PLANTAO.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      plantao:
        description: 'segundos de plantão'
        default: '1500'

permissions:
  contents: read
  actions: write # só para chamar o próximo plantão

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      COFRE_REPO: ${{ secrets.COFRE_REPO }}
      COFRE_TOKEN: ${{ secrets.COFRE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Plantão
        run: python3 nuvem/telegram.py "${{ github.event.inputs.plantao || '1500' }}"
      - name: Chamar o próximo plantão
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f nuvem/PARAR_PLANTAO ]; then echo "corrente parada de propósito"; exit 0; fi
          # plantão que falhou espera antes de chamar o próximo (não vira laço rápido)
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          gh workflow run telegram.yml -R "${{ github.repository }}" -f plantao=1500

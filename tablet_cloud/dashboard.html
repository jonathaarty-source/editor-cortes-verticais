<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvem do Jarvis</title>
<style>
  :root{
    --bg1:#e9edf5; --bg2:#dfe4ee;
    --glass:rgba(255,255,255,.55); --glass-border:rgba(255,255,255,.7);
    --txt:#1c1f26; --sub:#6b7180;
    --ok:#30c46a; --warn:#ffb23f; --bad:#ff5a5f; --blue:#3b82f6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg1:#0e1016; --bg2:#15171f; --glass:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.12);
           --txt:#f1f2f6; --sub:#9196a3; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(120,150,255,.25), transparent),
      radial-gradient(700px 500px at 110% 10%, rgba(255,160,200,.18), transparent),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    padding:env(safe-area-inset-top,22px) 14px 30px;
    min-height:100%;
  }
  .top{padding:6px 4px 14px}
  h1{font-size:19px;font-weight:650;margin:0 0 2px;letter-spacing:-.01em}
  .sub{color:var(--sub);font-size:12.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{
    background:var(--glass); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--glass-border); border-radius:20px; padding:12px 14px;
    box-shadow:0 1px 1px rgba(0,0,0,.03), 0 8px 24px rgba(20,20,40,.06);
  }
  .card.wide{grid-column:1/-1}
  .label{color:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .value{font-size:17px;font-weight:650;margin-top:3px;letter-spacing:-.01em}
  .tag{color:var(--sub);font-size:11.5px;margin-top:1px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .ok{background:var(--ok)} .warn{background:var(--warn)} .bad{background:var(--bad)}
  .row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--glass-border);font-size:13.5px}
  .row:last-child{border-bottom:none}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btn{
    flex:1; text-align:center; text-decoration:none; color:var(--txt);
    background:var(--glass); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border); padding:11px; border-radius:16px;
    font-size:13.5px; font-weight:600; letter-spacing:-.01em;
  }
  .btn.primary{background:var(--blue); color:#fff; border-color:transparent}
  .btn:active{transform:scale(.97)}
  .foot{color:var(--sub);font-size:10.5px;text-align:center;margin-top:16px;opacity:.7}
</style>
</head>
<body>
  <div class="top">
    <h1>Nuvem do Jarvis</h1>
    <div class="sub" id="relogio">—</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Bateria</div>
      <div class="value" id="v-bateria">—</div>
      <div class="tag" id="v-uptime">—</div>
    </div>
    <div class="card">
      <div class="label">Rede</div>
      <div class="value"><span class="dot ok"></span>Sempre ligada</div>
      <div class="tag">Doze desligado</div>
    </div>
    <div class="card wide">
      <div class="label">PC do escritório</div>
      <div class="value" id="v-pc">verificando…</div>
      <div class="tag" id="v-pc-tag">—</div>
    </div>
    <div class="card wide">
      <div class="label">Rodando neste tablet</div>
      <div class="row"><span>Plantão do Telegram</span><span class="tag" id="j-telegram">—</span></div>
      <div class="row"><span>Espaço livre</span><span class="tag" id="v-disco">—</span></div>
      <div class="row"><span>Python · Git</span><span class="tag" id="v-ver">—</span></div>
    </div>
  </div>

  <div class="btns">
    <a class="btn primary" href="#" onclick="location.reload();return false;">Atualizar</a>
    <a class="btn" id="link-pc" href="#">Painel do PC</a>
  </div>

  <div class="foot">v1 · roda local no Termux</div>

<script>
async function carregar(){
  document.getElementById('relogio').textContent = new Date().toLocaleString('pt-BR');
  try{
    const r = await fetch('/status.json', {cache:'no-store'});
    const d = await r.json();
    document.getElementById('v-bateria').textContent = d.bateria ? d.bateria + '%' : '—';
    document.getElementById('v-uptime').textContent = 'painel ligado há ' + (d.uptime || '—');
    document.getElementById('v-disco').textContent = d.disco_livre || '—';
    document.getElementById('v-ver').textContent = (d.python||'?') + ' · ' + (d.git||'?');
    document.getElementById('j-telegram').textContent = d.telegram_ativo ? 'rodando' : 'aguardando segredo';
  }catch(e){}
  const ipsPC = (window.IP_PC ? [window.IP_PC] : []);
  for (const ip of ipsPC){
    try{
      const c = new AbortController(); setTimeout(()=>c.abort(), 1200);
      await fetch('http://'+ip+':4747/', {mode:'no-cors', signal:c.signal});
      document.getElementById('v-pc').textContent = 'ligado, na mesma rede';
      document.getElementById('v-pc-tag').textContent = ip+':4747';
      document.getElementById('link-pc').href = 'http://'+ip+':4747/';
      return;
    }catch(e){}
  }
  document.getElementById('v-pc').textContent = 'desligado (ou fora da rede)';
  document.getElementById('v-pc-tag').textContent = 'rodando sozinho';
}
carregar(); setInterval(carregar, 15000);
</script>
</body>
</html>
